<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="980" height="500" fill="#FFFFFF" rx="14"/>

  <!-- Title -->
  <text x="490" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1F2A44">Zoom gesture — V sign with index + middle fingers</text>
  <text x="490" y="72" text-anchor="middle" font-size="15" fill="#6B7280">Ring and pinky stay curled · same hand as scrolling: fingers together = scroll, open V = zoom</text>

  <!-- ================= Panel A: start (scroll pose) ================= -->
  <g transform="translate(180,380)">
    <!-- wrist -->
    <rect x="-35" y="-14" width="70" height="46" rx="20" fill="#FFD9B3" stroke="#D19A6C" stroke-width="4"/>
    <!-- curled ring / pinky -->
    <g stroke-linecap="round">
      <line x1="22" y1="-106" x2="56" y2="-92" stroke="#D19A6C" stroke-width="26"/>
      <line x1="22" y1="-106" x2="56" y2="-92" stroke="#FFD9B3" stroke-width="22"/>
      <line x1="20" y1="-84" x2="52" y2="-72" stroke="#FFD9B3" stroke-width="20"/>
    </g>
    <!-- palm -->
    <rect x="-60" y="-135" width="120" height="130" rx="35" fill="#FFD9B3" stroke="#D19A6C" stroke-width="4"/>
    <!-- index (slightly left) -->
    <line x1="-22" y1="-125" x2="-30" y2="-245" stroke="#FFB259" stroke-width="32" stroke-linecap="round"/>
    <!-- middle (slightly right) -->
    <line x1="14" y1="-125" x2="22" y2="-245" stroke="#FFB259" stroke-width="32" stroke-linecap="round"/>
  </g>
  <text x="180" y="452" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2A44">1 · V with two fingers</text>
  <text x="180" y="474" text-anchor="middle" font-size="14" fill="#6B7280">index + middle up, ring + pinky curled</text>

  <!-- arrow A -> B -->
  <g>
    <line x1="300" y1="255" x2="382" y2="255" stroke="#94A3B8" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="341" y="238" text-anchor="middle" font-size="15" font-weight="700" fill="#16A34A">open</text>
  </g>

  <!-- ================= Panel B: zoom in ================= -->
  <g transform="translate(490,380)">
    <rect x="-35" y="-14" width="70" height="46" rx="20" fill="#FFD9B3" stroke="#D19A6C" stroke-width="4"/>
    <g stroke-linecap="round">
      <line x1="26" y1="-106" x2="60" y2="-92" stroke="#D19A6C" stroke-width="26"/>
      <line x1="26" y1="-106" x2="60" y2="-92" stroke="#FFD9B3" stroke-width="22"/>
      <line x1="24" y1="-84" x2="56" y2="-72" stroke="#FFD9B3" stroke-width="20"/>
    </g>
    <rect x="-60" y="-135" width="120" height="130" rx="35" fill="#FFD9B3" stroke="#D19A6C" stroke-width="4"/>
    <!-- index leaning left -->
    <line x1="-24" y1="-125" x2="-64" y2="-245" stroke="#22C55E" stroke-width="32" stroke-linecap="round"/>
    <!-- middle leaning right -->
    <line x1="16" y1="-125" x2="56" y2="-245" stroke="#22C55E" stroke-width="32" stroke-linecap="round"/>
    <!-- spread hint arc between the tips -->
    <path d="M -58,-232 Q -4,-268 50,-232" fill="none" stroke="#22C55E" stroke-width="3" stroke-dasharray="7 7" opacity="0.85"/>
  </g>
  <text x="490" y="452" text-anchor="middle" font-size="17" font-weight="700" fill="#16A34A">2 · Open the V → zoom in</text>
  <text x="490" y="474" text-anchor="middle" font-size="14" fill="#6B7280">wider gap = content gets bigger</text>

  <!-- arrow B -> C -->
  <g>
    <line x1="610" y1="255" x2="692" y2="255" stroke="#94A3B8" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="651" y="238" text-anchor="middle" font-size="15" font-weight="700" fill="#EA580C">close</text>
  </g>

  <!-- ================= Panel C: zoom out ================= -->
  <g transform="translate(800,380)">
    <rect x="-35" y="-14" width="70" height="46" rx="20" fill="#FFD9B3" stroke="#D19A6C" stroke-width="4"/>
    <g stroke-linecap="round">
      <line x1="18" y1="-106" x2="52" y2="-92" stroke="#D19A6C" stroke-width="26"/>
      <line x1="18" y1="-106" x2="52" y2="-92" stroke="#FFD9B3" stroke-width="22"/>
      <line x1="16" y1="-84" x2="48" y2="-72" stroke="#FFD9B3" stroke-width="20"/>
    </g>
    <rect x="-60" y="-135" width="120" height="130" rx="35" fill="#FFD9B3" stroke="#D19A6C" stroke-width="4"/>
    <!-- index nearly vertical -->
    <line x1="-18" y1="-125" x2="-24" y2="-245" stroke="#EA580C" stroke-width="32" stroke-linecap="round"/>
    <!-- middle nearly vertical -->
    <line x1="10" y1="-125" x2="16" y2="-245" stroke="#EA580C" stroke-width="32" stroke-linecap="round"/>
    <!-- small gap hint -->
    <path d="M -20,-234 Q 0,-252 14,-234" fill="none" stroke="#EA580C" stroke-width="3" stroke-dasharray="5 6" opacity="0.85"/>
  </g>
  <text x="800" y="452" text-anchor="middle" font-size="17" font-weight="700" fill="#EA580C">3 · Close the V → zoom out</text>
  <text x="800" y="474" text-anchor="middle" font-size="14" fill="#6B7280">smaller gap = content gets smaller</text>

  <!-- bottom note -->
  <text x="490" y="105" text-anchor="middle" font-size="14" fill="#6B7280">Fingers simply held together and moved = normal scroll. Under the hood zoom sends Ctrl + mouse-wheel.</text>
</svg>
